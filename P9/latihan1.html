<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Eksplorasi DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.6
        }
        
        .highlight {
            color: #245b85;
            background: #eaf3fa;
            padding: 8px;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <h1 id="judul">Latihan Eksplorasi DOM</h1>
    <p class="deskripsi">Ini paragraf pertama untuk latihan DOM.</p>
    <p class="deskripsi">Ini paragraf kedua untuk latihan DOM.</p>
    <ul>
        <li class="item">Belajar HTML</li>
        <li class="item">Belajar CSS</li>
        <li class="item">Belajar JavaScript</li>
    </ul>
    <script>
        // Memilih heading berdasarkan id.
        const heading = document.getElementById("judul");

        // Memilih dua paragraf berdasarkan class.
        const paragraphs = document.querySelectorAll(".deskripsi");

        // Memilih seluruh elemen list.
        const items = document.querySelectorAll(".item");

        // Menampilkan hasil seleksi di Console.
        console.log("Heading:", heading);
        console.log("Paragraf:", paragraphs);
        console.log("Semua item list:", items);

        // Mengubah teks heading dan menambahkan class.
        heading.textContent = "Hasil Latihan Eksplorasi DOM";
        heading.classList.add("highlight");

        // Menampilkan isi setiap item list di Console
        items.forEach((item, index) => {
            console.log(`Item ${index + 1}: ${item.textContent}`);
        });
    </script>
</body>

</html>
